    <main id="conteudo" class="page-main">
      <h1>Palpites da rodada</h1>

      <form id="form-palpite" class="card p-3 mb-4">
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label" for="timeA">Time da casa</label>
            <select id="timeA" name="timeA" class="form-select" required>
              <option value="">Escolha</option>
              <option>Vasco</option>
              <option>Flamengo</option>
              <option>Palmeiras</option>
              <option>Corinthians</option>
            </select>
          </div>

          <div class="col-6 col-md-2">
            <label class="form-label" for="golsA">Gols</label>
            <input type="number" id="golsA" name="golsA" class="form-control" min="0" max="20" value="0" required />
          </div>

          <div class="col-6 col-md-2">
            <label class="form-label" for="golsB">Gols</label>
            <input type="number" id="golsB" name="golsB" class="form-control" min="0" max="20" value="0" required />
          </div>

          <div class="col-md-3">
            <label class="form-label" for="timeB">Time visitante</label>
            <select id="timeB" name="timeB" class="form-select" required>
              <option value="">Escolha</option>
              <option>Vasco</option>
              <option>Flamengo</option>
              <option>Palmeiras</option>
              <option>Corinthians</option>
            </select>
          </div>

          <div class="col-md-2 d-flex align-items-end">
            <button type="submit" class="btn btn-success w-100">Salvar</button>
          </div>
        </div>
      </form>

      <h2>Meus palpites</h2>
      <p id="palpites-vazio" class="empty-state">Seus palpites salvos aparecerão aqui.</p>
      <ul id="lista-palpites" class="list-group mb-3" aria-live="polite"></ul>
      <button id="btn-limpar" type="button" class="btn btn-outline-danger">Apagar todos</button>
      <p id="palpite-status" class="form-status" role="status" aria-live="polite"></p>
    </main>

    <footer class="rodape">
      <p>&copy; 2026 Mundo da Bola</p>
