<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Entre em contato com o Mundo da Bola para enviar dúvidas e sugestões." />
    <title>Contato - Mundo da Bola</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2748/2748619.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <header class="site-header">
      <a class="site-brand" href="index.html" aria-label="Mundo da Bola — início">
        MUNDO <span>DA BOLA</span>
      </a>
      <nav class="site-nav" aria-label="Navegação principal">
        <a href="index.html">Início</a>
        <a href="historia.html">História</a>
        <a href="times.html">Times</a>
        <a href="jogadores.html">Jogadores</a>
        <a href="copas.html">Copas</a>
        <a href="videos.html">Vídeos</a>
        <a href="audios.html">Áudios</a>
        <a href="noticias.html">Notícias</a>
        <a href="palpites.html">Palpites</a>
        <a href="contato.html" aria-current="page">Contato</a>
        <a href="https://www.fifa.com" target="_blank" rel="noopener noreferrer">FIFA ↗</a>
      </nav>
    </header>

    <main id="conteudo" class="page-main">
      <h1>Contato</h1>

      <form id="form-contato" class="card p-4 mx-auto form-contato">
        <div class="mb-3">
          <label class="form-label" for="nome">Nome</label>
          <input
            type="text"
            id="nome"
            name="nome"
            class="form-control"
            placeholder="Seu nome"
            required
            minlength="3"
            pattern="[A-Za-zÀ-ÿ ]+"
            title="Use apenas letras."
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="email">E-mail</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="voce@exemplo.com" required />
        </div>

        <div class="mb-3">
          <label class="form-label" for="assunto">Assunto</label>
          <select id="assunto" name="assunto" class="form-select" required>
            <option value="">Escolha</option>
            <option>Dúvida</option>
            <option>Sugestão</option>
            <option>Elogio</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" for="mensagem">Mensagem</label>
          <textarea
            id="mensagem"
            name="mensagem"
            class="form-control"
            rows="4"
            placeholder="Escreva sua mensagem"
            required
            minlength="10"
          ></textarea>
        </div>

        <button type="submit" class="btn btn-success">Enviar</button>
        <p id="contato-status" class="form-status" role="status" aria-live="polite"></p>
      </form>
    </main>

    <footer class="rodape">
      <p>&copy; 2026 Mundo da Bola</p>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
