  <body>
    <header>
      <nav class="navbar navbar-expand navbar-dark bg-success">
        <div class="container-fluid justify-content-center">
          <div class="navbar-nav flex-wrap">
            <a class="nav-link" href="index.html">Início</a>

          </div>
        </div>
      </nav>
    </header>

    <main class="container py-4">
      <h1>Contato</h1>

      <form id="form-contato" class="card p-4 mx-auto" style="max-width: 600px;">
        <div class="mb-3">
          <label class="form-label" for="nome">Nome</label>
          <input
            type="text"
            id="nome"
            class="form-control"
            placeholder="Seu nome"
            required
            minlength="3"
            pattern="[A-Za-zÀ-ÿ ]+"
            title="Use apenas letras."
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="email">E-mail</label>
          <input type="email" id="email" class="form-control" placeholder="voce@exemplo.com" required />
        </div>

        <div class="mb-3">
          <label class="form-label" for="assunto">Assunto</label>
          <select id="assunto" class="form-select" required>
            <option value="">Escolha</option>
            <option>Dúvida</option>
            <option>Sugestão</option>
            <option>Elogio</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" for="mensagem">Mensagem</label>
          <textarea
            id="mensagem"
            class="form-control"
            rows="4"
            placeholder="Escreva sua mensagem"
            required
            minlength="10"
          ></textarea>
        </div>

        <button type="submit" class="btn btn-success">Enviar</button>
      </form>
    </main>

    <footer class="rodape">
      <p>&copy; 2026 Mundo da Bola</p>
    </footer>

    <script src="js/script.js"></script>
  </body>
